          import json
          import re
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          ROOT = Path('vb_video1_revised_r4')
          OUT = ROOT / 'audio'
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_vb_video1_revised_r4')
          OUT.mkdir(parents=True, exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 630_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु। पहला पाठ। अर्थ और पहला निर्देशित स्पर्श-अनुभव।'),
              (9.0, 'यह सामग्री केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (18.0, 'आज हम विश्रांति का सरल अर्थ समझेंगे, शरीर और हाथों की तैयारी करेंगे, और अंगूठे तथा तर्जनी के हल्के स्पर्श को पहली बार जानेंगे।'),

              (30.0, 'विश्रांति का सरल अर्थ है परम विश्राम।'),
              (38.0, 'आज इस शब्द को किसी बड़े सिद्धान्त की तरह नहीं, केवल एक दिशा की तरह समझें। शरीर और मन में अनावश्यक प्रयास कम करना ही हमारी पहली तैयारी है।'),
              (51.0, 'आज का पहला अभ्यास-साधन अंगूठे और तर्जनी की नोकों का अत्यन्त हल्का स्पर्श है।'),
              (61.0, 'यह अभी अंतिम विश्रांति बिन्दु की घोषणा नहीं है। यह उस दिशा में प्रवेश करने का पहला सरल अभ्यास-बिन्दु है।'),

              (72.0, 'अभ्यास किसी सुरक्षित और शांत स्थान पर, स्थिर बैठकर करें।'),
              (80.0, 'वाहन चलाते समय, सड़क पार करते समय, मशीन चलाते समय, या किसी ऐसे काम में इसे न करें जिसमें पूरा बाहरी ध्यान आवश्यक हो।'),

              (94.0, 'अब अपने लिए एक सहज और स्थिर बैठने की स्थिति चुनें।'),
