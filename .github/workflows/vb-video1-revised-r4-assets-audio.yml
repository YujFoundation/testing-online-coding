name: VB Video1 Revised R4 Assets and Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.issue.title, '[automation] Build VB Video1 revised R4')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_video1_revised_r4_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_video1_revised_r4_run_id.txt
          git commit -m 'automation: publish VB Video1 revised R4 run id' || true
          git push

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl file
          python -m pip install --quiet edge-tts pydub pillow

      - name: Fetch Indian posture reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vb_video1_revised_r4/assets
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          OUT='vb_video1_revised_r4/assets/indian_sukhasana.jpg'
          if ! curl -A "$UA" -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
              'https://unsplash.com/photos/IFC3fD0ZaoA/download?force=true&w=2400' -o "$OUT"; then
            curl -A "$UA" -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
              'https://static.toiimg.com/photo/108940357/108940357.jpg' -o "$OUT"
          fi
          test -s "$OUT"
          file "$OUT"
          python - <<'PY'
          from PIL import Image
          p='vb_video1_revised_r4/assets/indian_sukhasana.jpg'
          im=Image.open(p).convert('RGB')
          if im.width < 900 or im.height < 700:
              im=im.resize((max(1200,im.width*2),max(900,im.height*2)),Image.Resampling.LANCZOS)
              im.save(p,quality=96)
          print('asset',im.size)
          PY
          cat > vb_video1_revised_r4/assets/ASSET_SOURCE.txt <<'TXT'
          Primary posture reference: Unsplash free photo IFC3fD0ZaoA by Aparna Johri, downloaded through the Unsplash photo download endpoint. A fallback reference is used only if that endpoint fails.
          TXT

      - name: Generate natural Hindi narration and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
