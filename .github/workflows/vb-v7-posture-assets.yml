name: VB V7 Realistic Posture Assets

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-assets:
    if: startsWith(github.event.issue.title, '[automation] Fetch VB V7 posture assets')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_v7_posture_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_v7_posture_run_id.txt
          git commit -m 'automation: publish VB V7 posture run id' || true
          git push

      - name: Fetch posture photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vb_v7_posture_assets
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          curl -A "$UA" -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            'https://images.pexels.com/photos/6303429/pexels-photo-6303429.jpeg?auto=compress&dpr=1&h=1000&w=1600' \
            -o vb_v7_posture_assets/sukhasana_real.jpg
          curl -A "$UA" -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            'https://images.pexels.com/photos/6303440/pexels-photo-6303440.jpeg?auto=compress&dpr=1&h=1000&w=1600' \
            -o vb_v7_posture_assets/vajrasana_real.jpg
          curl -A "$UA" -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            'https://cdn.prod.website-files.com/66f4d01f1b4b646400b1cfab/6769a5d88b7e384f0001acdd_6769a38a512e0fc28adfe20d_Chair%2520yoga%2520short%2520explanation%2520image.jpeg' \
            -o vb_v7_posture_assets/chair_sitting_real.jpg
          file vb_v7_posture_assets/*
          test -s vb_v7_posture_assets/sukhasana_real.jpg
          test -s vb_v7_posture_assets/vajrasana_real.jpg
          test -s vb_v7_posture_assets/chair_sitting_real.jpg
          cat > vb_v7_posture_assets/ASSET_SOURCES.txt <<'TXT'
          sukhasana_real.jpg — Pexels photo 6303429 by Klaus Nielsen
          vajrasana_real.jpg — Pexels photo 6303440 by Klaus Nielsen
          chair_sitting_real.jpg — chair-yoga reference image from Reverse Health article
          TXT

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: vb-v7-realistic-posture-assets
          path: vb_v7_posture_assets
          retention-days: 1
