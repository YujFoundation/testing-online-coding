name: VB Video7 Lifestyle Hindi Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB Video7 lifestyle audio')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_video7_lifestyle_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_video7_lifestyle_run_id.txt
          git commit -m 'automation: publish VB Video7 run id' || true
          git push

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate Hindi narration and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          ROOT = Path('vb_video7_lifestyle_audio')
          CUE_DIR = ROOT / 'voice_cues'
          TMP = Path('tmp_vb_video7_lifestyle')
          ROOT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 630_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु। पाठ सात। योगासन, प्रकृति, परिश्रम, मनोदशा और आचरण का अनुभव-आधारित निरीक्षण।'),
              (11.0, 'यह सामग्री केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (21.0, 'आज हम कोई नया आध्यात्मिक अभ्यास नहीं जोड़ेंगे। हम देखेंगे कि जीवन की कुछ स्थितियाँ हमारे मूल स्पर्श-बिन्दु की स्पष्टता को कैसे प्रभावित करती हैं।'),
              (37.0, 'यह वीडियो कोई सार्वभौमिक स्वास्थ्य-नियम नहीं देता। उद्देश्य है—अपने अनुभव में बार-बार दिखाई देने वाले व्यक्तिगत ढंग को ईमानदारी से पहचानना।'),

              (54.0, 'सबसे पहले आज की स्थिति का छोटा आधार-अभिलेख बनाएँ।'),
              (62.0, 'लिखें—आज शरीर की ऊर्जा कैसी है, कितनी थकान है, मनोदशा कैसी है, और मूल स्पर्श-बिन्दु स्पष्ट होने में लगभग कितना समय लगा।'),
              (85.0, 'यही चार बातें आगे की सभी तुलनाओं का आधार रहेंगी।'),

              (96.0, 'अब भोजन और सेवन से जुड़ी एक सावधानी समझें।'),
              (104.0, 'स्रोत में मदिरा से बचने और बार-बार संवेदनशीलता घटाने वाले तामसिक या अत्यधिक मसालेदार सेवन को कम करने की सलाह है।'),
              (123.0, 'किसी अस्वास्थ्यकर स्थिति को प्रयोग के लिए जानबूझकर पैदा न करें। जीवन में जो स्वाभाविक रूप से घटे, केवल उसका प्रभाव दर्ज करें।'),

              (141.0, 'योगासन को सहायक साधन की तरह देखा जा सकता है।'),
              (149.0, 'जहाँ सम्भव और शरीर के लिए उचित हो, सुबह या शाम किए गए योगासन के पहले और बाद मूल स्पर्श-बिन्दु की स्पष्टता की तुलना करें।'),
              (169.0, 'योगासन का प्रकार, अवधि, अभ्यास से पहले की स्थिति और बाद की स्पष्टता लिखें।'),

              (183.0, 'प्रकृति में समय बिताना भी एक सहायक विकल्प है।'),
              (192.0, 'मिट्टी या घास पर नंगे पैर चलना केवल तभी चुनें, जब स्थान स्वच्छ, सुरक्षित और पैरों के लिए उपयुक्त हो।'),
              (209.0, 'चलने से पहले और बाद अपनी ऊर्जा, मनोदशा और स्पर्श-बिन्दु की स्पष्टता लिखें।'),

              (224.0, 'अब अधिक परिश्रम के प्रभाव को देखें।'),
              (232.0, 'गर्मी में अधिक दौड़, थकाऊ यात्रा, अनावश्यक काम या लगातार शरीर को खाली कर देने वाली गतिविधि के बाद अनुभव में कोई कमी हो सकती है।'),
              (252.0, 'थकान को जानबूझकर पैदा न करें। जो स्वाभाविक रूप से हुआ है, उसका प्रकार, अवधि और बाद की स्पष्टता लिखें।'),

              (270.0, 'क्रोध के समय और उसके बाद भी निरीक्षण किया जा सकता है।'),
              (279.0, 'क्रोध का कारण, उसकी तीव्रता, मूल स्पर्श-बिन्दु में आया परिवर्तन और सामान्य स्पष्टता लौटने में लगा समय लिखें।'),
              (300.0, 'क्रोध को दबाने, बढ़ाने या आध्यात्मिक अभ्यास से बलपूर्वक समाप्त करने की कोशिश न करें। पहले स्थिति को सुरक्षित ढंग से सँभालें, फिर केवल निरीक्षण दर्ज करें।'),

              (324.0, 'यौन गतिविधि या चरमसुख के बाद जीवंतता और संवेदनशीलता में कोई परिवर्तन हो, तो उसे भी निजी और सम्मानपूर्ण अभिलेख में लिखा जा सकता है।'),
              (345.0, 'समय, अनुभव की तीव्रता, बाद की स्पष्टता और सामान्य स्थिति लौटने में लगा समय लिखें।'),
              (360.0, 'इस निरीक्षण का उद्देश्य अपराधबोध या बलपूर्वक दमन नहीं है। परिवर्तन समझ से आए, डर या दबाव से नहीं।'),

              (379.0, 'अब आचरण से जुड़ी तुलना समझें।'),
              (387.0, 'ईमानदारी, निष्ठा, अहिंसा, प्रेमपूर्ण व्यवहार, दान और सेवा के बाद अपने भीतर फैलाव, संकुचन, सहजता या अशांति में क्या परिवर्तन हुआ, उसे देखें।'),
              (409.0, 'एक अच्छे काम के बदले विशेष अनुभव की अपेक्षा न करें। केवल यह लिखें कि वास्तविक अनुभव में क्या बदला और क्या नहीं बदला।'),
              (427.0, 'एक घटना से कठोर नियम न बनाएँ। वही ढंग अलग-अलग अवसरों पर दोहरता है या नहीं, यह देखना अधिक महत्वपूर्ण है।'),

              (446.0, 'अब आप मेरे साथ एक सप्ताह का छोटा निरीक्षण-कार्य बनाएँ।'),
              (455.0, 'पहला, एक सहायक कारक चुनें—जैसे योगासन, प्रकृति में सुरक्षित चलना, सेवा या प्रेमपूर्ण आचरण।'),
              (474.0, 'दूसरा, एक ऐसा कारक चुनें जो जीवन में स्वाभाविक रूप से कभी-कभी थकान, अशांति या संवेदनशीलता में कमी से जुड़ा दिखाई देता हो।'),
              (493.0, 'मदिरा, क्रोध, अत्यधिक परिश्रम या किसी हानिकारक स्थिति को केवल परीक्षण के लिए कभी पैदा न करें।'),
              (509.0, 'अपनी नोटबुक में सात स्तम्भ बनाएँ—तारीख, चुना हुआ कारक, पहले की ऊर्जा, पहले की स्पष्टता, बाद की ऊर्जा, बाद की स्पष्टता और सामान्य स्थिति लौटने का समय।'),
              (535.0, 'अब अपनी सारणी बनाएँ और पहला सहायक कारक लिखें। अगले तीस सेकंड केवल लिखने के लिए हैं।'),
              (552.0, 'कारक ऐसा चुनें जिसे आप सुरक्षित रूप से और स्वाभाविक दिनचर्या में देख सकें।'),

              (568.0, 'अब सप्ताह के भीतर कम से कम तीन सुरक्षित निरीक्षण-अवसर तय करें।'),
              (578.0, 'हर बार मूल अभ्यास वही रखें। केवल परिस्थिति बदले, ताकि तुलना स्पष्ट रह सके।'),
              (593.0, 'अगले पच्चीस सेकंड तारीखें और सम्भावित समय लिखें।'),

              (610.0, 'अन्तिम जाँच करें। क्या आपने कोई हानिकारक स्थिति जानबूझकर नहीं बनाई? क्या आप पहले और बाद दोनों लिखेंगे? क्या एक घटना के आधार पर निर्णय नहीं करेंगे?'),
              (624.0, 'आज का पहला निरीक्षण-कार्य स्पष्ट लिखें और अभ्यास के बाद शिक्षक के लिए अपना प्रश्न जोड़ें। यही पाठ सात का समापन है।'),
          ]

          async def synth(text: str, out_mp3: Path) -> None:
              comm = edge_tts.Communicate(text, VOICE, rate='-4%', pitch='+0Hz', volume='+0%')
              await comm.save(str(out_mp3))

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-47, seg.dBFS - 28), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0] - 80)
              b = min(len(seg), ranges[-1][1] + 130)
              return seg[a:b]

          def atempo_chain(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
                  '-filter:a',atempo_chain(factor),'-ar','48000','-ac','1',str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000); m, ms = divmod(ms, 60_000); s, ms = divmod(ms, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          async def main() -> None:
              master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta, srt, script_lines = [], [], []
              for i, (start, text) in enumerate(CUES, 1):
                  mp3 = TMP / f'{i:02d}.mp3'
                  await synth(text, mp3)
                  seg = trim(AudioSegment.from_file(mp3)).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else TOTAL_MS / 1000
                  max_ms = max(900, int((next_start - start) * 1000) - 250)
                  seg = fit(seg, max_ms, i)
                  wav = CUE_DIR / f'{i:02d}.wav'
                  seg.export(wav, format='wav')
                  master = master.overlay(seg, position=int(start * 1000))
                  end = min(TOTAL_MS / 1000, start + len(seg) / 1000)
                  meta.append({'start': start, 'end': end, 'text': text, 'audio': wav.name})
                  srt.extend([str(i), f'{srt_time(start)} --> {srt_time(end)}', text, ''])
                  script_lines.append(text)

              wav_master = ROOT / 'Vishranti_Bindu_Video7_Hindi_Narration.wav'
              m4a_master = ROOT / 'Vishranti_Bindu_Video7_Hindi_Narration.m4a'
              master.export(wav_master, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav_master),
                  '-af','highpass=f=70,lowpass=f=12000,alimiter=limit=0.94',
                  '-t',str(TOTAL_MS/1000),'-c:a','aac','-b:a','224k','-ar','48000','-ac','2',str(m4a_master)
              ], check=True)
              (ROOT / 'cues.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
              (ROOT / 'Vishranti_Bindu_Video7_Hindi_Subtitles.srt').write_text('\n'.join(srt), encoding='utf-8')
              (ROOT / 'Vishranti_Bindu_Video7_Hindi_Voiceover_Script.txt').write_text('\n\n'.join(script_lines), encoding='utf-8')
              (ROOT / 'README.txt').write_text('VB Video 7 Hindi narration and subtitles. Duration: 10:30. Voice: hi-IN-SwaraNeural.', encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-video7-lifestyle-audio
          path: vb_video7_lifestyle_audio
          retention-days: 1
