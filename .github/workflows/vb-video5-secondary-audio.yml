name: VB Video5 Secondary Awareness Hindi Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB Video5 secondary audio')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_video5_secondary_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_video5_secondary_run_id.txt
          git commit -m 'automation: publish VB Video5 run id' || true
          git push

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate Hindi narration and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import re
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          OUT = Path('vb_video5_secondary_audio')
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_video5_secondary_audio')
          OUT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 630_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु। पाठ पाँच। विचार, भावनाएँ और अन्य अनुभूतियों के बीच मूल बिन्दु बनाए रखना।'),
              (11.0, 'यह सामग्री केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (21.0, 'आज हम सीखेंगे कि मूल स्पर्श-बिन्दु स्पष्ट रखते हुए, अपने आप उपस्थित किसी हल्के विचार, भावना या शारीरिक अनुभूति को बिना दबाए और बिना बदलने की कोशिश किए कैसे जाना जाए।'),
              (39.0, 'इस अभ्यास में किसी तीव्र स्मृति, तीव्र भावना या दर्द को जानबूझकर बुलाना नहीं है। जो हल्का और स्वाभाविक रूप से उपस्थित है, केवल उसी से सीखना है।'),

              (55.0, 'अभ्यास के दौरान विचार आना, मन का किसी बात पर जाना, भाव बदलना या शरीर में कोई हल्की अनुभूति होना सामान्य हो सकता है।'),
              (70.0, 'उसे अच्छा या बुरा कहने की आवश्यकता नहीं है। उसे दबाना भी नहीं है और उसकी कहानी के पीछे चलना भी नहीं है।'),
              (84.0, 'आज का नियम सरल है। मूल स्पर्श-बिन्दु केन्द्र में रहेगा। बाकी जो भी उपस्थित हो, वह आसपास के सहायक क्षेत्र में रह सकता है।'),

              (102.0, 'अब सुरक्षित और सहज स्थिति में बैठें। कंधे, जबड़ा, पेट और हाथ ढीले रखें।'),
              (114.0, 'दीक्षा में बताए गए हाथ में अंगूठे और तर्जनी की नोकों का अत्यन्त हल्का स्पर्श बनाएँ। दबाव न दें।'),
              (128.0, 'ध्यान ठीक उसी छोटे बिन्दु पर रखें जहाँ त्वचा की दोनों सतहें मिल रही हैं।'),
              (139.0, 'कुछ क्षण केवल स्पर्श, हल्का दबाव, गर्माहट या त्वचा की बनावट को जानें।'),

              (153.0, 'अब समझें कि सहायक क्षेत्र का अर्थ क्या है।'),
              (160.0, 'मान लीजिए कोई विचार उपस्थित है। आप केवल इतना जानें कि विचार उपस्थित है। उसकी पूरी कहानी में न जाएँ।'),
              (175.0, 'यदि कोई भावना उपस्थित है, तो उसे हटाएँ नहीं। उसे बढ़ाएँ भी नहीं। वह जैसी है, उसे वैसे ही रहने दें।'),
              (190.0, 'यदि शरीर में कोई हल्की सामान्य अनुभूति है, तो उसे जान सकते हैं। दर्द, चक्कर या गहरी घबराहट हो, तो अभ्यास रोकें।'),
              (207.0, 'इन सबके बीच अंगूठे और तर्जनी का मूल स्पर्श-बिन्दु आपका लौटने का स्थान रहेगा।'),

              (222.0, 'ध्यान कैसे लौटाना है, इसे देखकर समझें।'),
              (229.0, 'पहले मूल बिन्दु स्पष्ट है। फिर ध्यान किसी विचार या भावना की ओर चला जाता है।'),
              (242.0, 'जैसे ही आपको पता चले कि मूल बिन्दु खो गया है, बिना झुँझलाहट के उँगलियों के स्पर्श पर वापस आएँ।'),
              (257.0, 'वापसी ही अभ्यास है। ध्यान का हटना असफलता नहीं है। हर शांत वापसी से दिशा स्पष्ट होती है।'),

              (274.0, 'अब आप मेरे साथ पूरा अभ्यास करें।'),
              (280.0, 'अपनी बैठने की स्थिति सहज करें।'),
              (288.0, 'कंधे, जबड़ा, पेट और हाथ ढीले छोड़ें।'),
              (297.0, 'अंगूठे और तर्जनी की नोकों का अत्यन्त हल्का स्पर्श बनाएँ।'),
              (309.0, 'आँखें तभी बंद करें, जब आपकी स्थिति पूरी तरह सुरक्षित हो।'),
              (320.0, 'पहले केवल मूल स्पर्श-बिन्दु को स्पष्ट करें।'),
              (334.0, 'जो वास्तविक शारीरिक जानकारी साफ़ है, उसी को जानें।'),
              (347.0, 'अब देखें, क्या कोई हल्का विचार अपने आप उपस्थित है। उसे बुलाएँ नहीं।'),
              (361.0, 'यदि विचार है, तो उसे रहने दें और साथ ही उँगलियों का स्पर्श जानें।'),
              (376.0, 'यदि विचार नहीं है, तो केवल स्पर्श के साथ बने रहें।'),
              (389.0, 'अब देखें, क्या कोई हल्की भावना या मनोदशा अपने आप स्पष्ट है।'),
              (404.0, 'उसे नाम देना आवश्यक नहीं है। उसे बदलना नहीं है। मूल बिन्दु को साथ रखते हुए केवल जानें।'),
              (421.0, 'यदि ध्यान पूरी तरह भावना या विचार में चला गया है, तो धीरे से उँगलियों के स्पर्श पर लौटें।'),
              (438.0, 'अब किसी हल्की शारीरिक अनुभूति को जानें, यदि वह पहले से उपस्थित हो।'),
              (454.0, 'मूल स्पर्श-बिन्दु को केन्द्र में रखें। बाकी अनुभूति को आसपास रहने दें।'),
              (469.0, 'अगले कुछ क्षण दोनों को साथ जानें। मूल बिन्दु स्पष्ट, बाकी अनुभूति सहायक क्षेत्र में।'),
              (488.0, 'यदि कुछ भी अतिरिक्त स्पष्ट नहीं है, तो केवल स्पर्श के साथ रहना पूर्णतः ठीक है।'),
              (502.0, 'एक बार फिर देखें। मूल बिन्दु उपस्थित है? हाथ ढीला है? दबाव बहुत हल्का है?'),
              (518.0, 'अब इस निर्देशित भाग को पूरा करें और मूल बिन्दु पर स्थिर रहें।'),

              (530.0, 'अब दो मिनट आप स्वयं अभ्यास करेंगे।'),
              (537.0, 'मूल स्पर्श-बिन्दु बनाए रखें। जो हल्का विचार, भावना या अनुभूति अपने आप आए, उसे बदलें नहीं।'),
              (566.0, 'यदि ध्यान भटके, तो शांतिपूर्वक मूल बिन्दु पर लौटें।'),
              (594.0, 'जो उपस्थित है, केवल उसे जानें। किसी परिणाम की कोशिश न करें।'),
              (620.0, 'अब स्वयं अभ्यास समाप्त करें।'),

              (623.0, 'उँगलियों को ढीला छोड़ें। आँखें धीरे से खोलें और आसपास के स्थान को फिर से जानें।'),
          ]

          # Extend spoken closure through separate post-cue text, while keeping total duration fixed.
          CUES += [
              (627.0, 'आज की मुख्य सीख है—जानना है, बदलना या नियंत्रित करना नहीं। अपने अभिलेख में एक पंक्ति लिखें: ध्यान कहाँ गया, और मैं मूल बिन्दु पर कैसे लौटा?'),
          ]

          def assert_hindi(text: str) -> None:
              if re.search(r'[A-Za-z]', text):
                  raise RuntimeError(f'विद्यार्थी पाठ में अंग्रेज़ी अक्षर मिला: {text}')
              if '□' in text or '\ufffd' in text:
                  raise RuntimeError(f'अमान्य अक्षर मिला: {text}')

          async def synth(text: str, out_mp3: Path) -> None:
              comm = edge_tts.Communicate(text, VOICE, rate='-5%', pitch='+0Hz', volume='+0%')
              await comm.save(str(out_mp3))

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-47, seg.dBFS - 28), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0] - 70)
              b = min(len(seg), ranges[-1][1] + 120)
              return seg[a:b]

          def atempo_chain(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
                  '-filter:a',atempo_chain(factor),'-ar','48000','-ac','1',str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1_000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          async def main() -> None:
              master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta = []
              srt = []
              script_lines = []
              for i, (start, text) in enumerate(CUES, 1):
                  assert_hindi(text)
                  mp3 = TMP / f'{i:02d}.mp3'
                  await synth(text, mp3)
                  seg = trim(AudioSegment.from_file(mp3)).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else TOTAL_MS / 1000
                  max_ms = max(700, int((next_start - start) * 1000) - 250)
                  seg = fit(seg, max_ms, i)
                  wav = CUE_DIR / f'{i:02d}.wav'
                  seg.export(wav, format='wav')
                  master = master.overlay(seg, position=int(start * 1000))
                  end = min(TOTAL_MS / 1000, start + len(seg) / 1000)
                  meta.append({'start': start, 'end': end, 'text': text, 'audio': wav.name})
                  srt.extend([str(i), f'{srt_time(start)} --> {srt_time(end)}', text, ''])
                  script_lines.append(text)

              wav_master = OUT / 'Vishranti_Bindu_Video5_Hindi_Narration.wav'
              m4a_master = OUT / 'Vishranti_Bindu_Video5_Hindi_Narration.m4a'
              master.export(wav_master, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav_master),
                  '-af','highpass=f=70,lowpass=f=12000,alimiter=limit=0.94',
                  '-t',str(TOTAL_MS / 1000),'-c:a','aac','-b:a','192k','-ar','48000','-ac','2',str(m4a_master)
              ], check=True)
              (OUT / 'cues.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Video5_Hindi_Subtitles.srt').write_text('\n'.join(srt), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Video5_Hindi_Voiceover_Script.txt').write_text('\n\n'.join(script_lines), encoding='utf-8')
              (OUT / 'README.txt').write_text('Hindi narration bundle for Vishranti Bindu Video 5. Duration: 10:30. No background music.', encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-video5-secondary-audio
          path: vb_video5_secondary_audio
          retention-days: 1
