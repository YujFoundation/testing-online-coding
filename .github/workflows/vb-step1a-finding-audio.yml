name: VB Step 1A Finding Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB Step 1A Finding audio')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_step1a_finding_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_step1a_finding_run_id.txt
          git commit -m 'automation: publish VB Step 1A audio run id' || true
          git push

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate natural Hindi narration and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import math
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          OUT = Path('vb_step1a_finding_audio')
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_step1a_audio')
          OUT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 540_000
          TARGET_DBFS = -18.0

          CUES = [
              (2.0, 'विश्रांति बिन्दु। चरण एक ए। विश्रांति बिन्दु को पहचानना।'),
