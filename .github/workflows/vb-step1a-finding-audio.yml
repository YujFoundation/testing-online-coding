              (13.0, 'आज हम सही मुद्रा, सही स्पर्श और मूल विश्रांति बिन्दु को पहचानने की पहली प्रक्रिया सीखेंगे।'),

              (21.0, 'अभ्यास किसी सुरक्षित और शांत स्थान पर, बैठकर करें।'),
              (29.0, 'वाहन चलाते समय, सड़क पार करते समय, या मशीन चलाते समय यह अभ्यास न करें।'),
              (38.5, 'दर्द, चक्कर, साँस फूलना, घबराहट या असामान्य अस्थिरता हो, तो तुरंत रुकें और शिक्षक से संपर्क करें।'),
              (49.5, 'इस वीडियो में कोई उन्नत अभ्यास नहीं कराया जाएगा।'),

              (57.0, 'पहले हर बात समझाई जाएगी। फिर दिखाई जाएगी। उसके बाद आपको स्वयं करने का समय मिलेगा।'),
              (67.0, 'अभी लक्ष्य किसी विशेष अनुभव को पैदा करना नहीं है।'),
              (76.0, 'यदि केवल साधारण स्पर्श महसूस हो, तो वही सही शुरुआत है।'),

              (82.0, 'अब बैठने की स्थिति चुनें।'),
              (86.0, 'सुखासन, वज्रासन, या स्थिर कुर्सी। जो आपके शरीर के लिए सहज हो।'),
              (96.0, 'रीढ़ स्वाभाविक रूप से सीधी रहे। उसे जबरन न खींचें।'),
              (104.5, 'कंधे ढीले रखें। ठोड़ी सहज रहे। पेट और हाथों में अनावश्यक तनाव न रखें।'),
              (115.0, 'हथेलियाँ जाँघों या गोद पर ऊपर की ओर रखें।'),
              (124.0, 'दीक्षा में जिस हाथ या हाथों का निर्देश मिला है, वही उपयोग करें।'),
              (132.0, 'अब अपनी सुविधाजनक स्थिति में बैठ जाइए।'),
              (136.0, 'इसके लिए आपके पास पंद्रह सेकंड हैं।'),

              (152.0, 'अब शरीर को स्थिर होने दें।'),
              (157.0, 'कंधों को ढीला छोड़ें।'),
              (162.0, 'जबड़े को सहज करें।'),
              (167.0, 'पेट को ढीला रखें।'),
              (172.0, 'हाथों और उँगलियों का अनावश्यक तनाव छोड़ दें।'),
              (178.0, 'आँखें धीरे से बंद करें।'),
              (184.0, 'अगले पंद्रह सेकंड केवल बैठने की स्थिरता महसूस करें।'),

              (201.0, 'अब हाथ की सही स्थिति समझें।'),
              (205.0, 'अंगूठे की नोक और तर्जनी की नोक को बहुत हल्के से मिलाना है।'),
              (214.0, 'सिर्फ त्वचा का संपर्क हो। दबाव बिल्कुल नहीं।'),
              (223.5, 'यदि उँगली चपटी हो रही है, नाखून दब रहे हैं, या हाथ में तनाव है, तो दबाव अधिक है।'),
              (237.0, 'सही स्थिति में दोनों नोकें बस मिलती हैं, और बाकी हाथ ढीला रहता है।'),
              (248.0, 'जहाँ दोनों त्वचा सतह मिलती हैं, वही मूल स्पर्श बिन्दु है।'),
              (258.0, 'अब अपने हाथ में यही हल्का संपर्क बनाएँ।'),
              (263.0, 'इसे करने के लिए आपके पास बीस सेकंड हैं।'),

              (285.0, 'अब विश्रांति बिन्दु को पहचानने की पहली सीढ़ी समझें।'),
              (291.0, 'सबसे पहले किसी सूक्ष्म अनुभव की तलाश नहीं करनी है।'),
              (298.0, 'पहले वास्तविक शारीरिक जानकारी पहचानें।'),
              (305.0, 'स्पर्श। क्या दोनों नोकें सच में मिल रही हैं?'),
              (313.0, 'हल्का दबाव। क्या संपर्क है, पर जोर नहीं?'),
              (321.0, 'गर्माहट। क्या वहाँ तापमान का कोई छोटा अंतर है?'),
              (330.0, 'बनावट। क्या त्वचा चिकनी, खुरदरी, नम या सूखी लग रही है?'),
              (340.0, 'इनमें से जो स्पष्ट है, केवल उसी को जानें।'),
              (347.0, 'अब तीस सेकंड केवल इन वास्तविक संकेतों को महसूस करें।'),
              (362.0, 'ध्यान भटके, तो उसी छोटे स्पर्श बिन्दु पर लौट आएँ।'),

              (379.0, 'अब, यदि कोई अतिरिक्त जानकारी अपने आप दिखाई दे, तो उसे केवल देखें।'),
              (389.0, 'गर्माहट बढ़ सकती है। झनझनाहट, धड़कन, कंपन, हल्का खिंचाव, प्रवाह या दोनों नोकों के बीच परस्परता जैसा कुछ महसूस हो सकता है।'),
              (403.0, 'इनमें से कुछ भी आवश्यक नहीं है। कुछ न मिले, तो भी मूल संपर्क सही है।'),
              (413.0, 'अनुभव को नाम देने, बढ़ाने, कल्पना करने या जबरन पैदा करने की कोशिश न करें।'),
              (424.0, 'यदि अनुभव हाथ या शरीर में फैले, तो उसे रहने दें। लेकिन उँगली का मूल बिन्दु प्राथमिक रखें।'),
              (435.0, 'अब पच्चीस सेकंड शांत रहकर देखें कि वास्तव में क्या उपस्थित है।'),

              (462.0, 'अब अंतिम बार, आप स्वयं विश्रांति बिन्दु को पहचानने का अभ्यास करें।'),
              (470.0, 'हल्का स्पर्श बनाए रखें। जो वास्तव में है, उसी को जानें।'),
              (479.0, 'अगले पैंतीस सेकंड मैं शांत रहूँगी।'),

              (516.0, 'अब हाथ ढीला छोड़ें। शरीर और आसपास के स्थान को महसूस करें। आँखें धीरे से खोलें।'),
              (522.0, 'आज की सफलता किसी विशेष अनुभूति में नहीं है। सफलता यह है कि मूल बिन्दु स्पष्ट हो और आप जो है, उसे बिना बल के जान सकें।'),
              (531.0, 'आज जो स्पष्ट हुआ, उसे एक पंक्ति में लिखें। आगे का अभ्यास केवल शिक्षक के निर्देश के अनुसार करें।'),
          ]

          async def choose_voice() -> str:
              voices = await edge_tts.list_voices()
              preferred = ['hi-IN-SwaraNeural', 'hi-IN-MadhurNeural']
              names = {v['ShortName']: v for v in voices}
              for p in preferred:
                  if p in names:
                      return p
              hindi_female = [v['ShortName'] for v in voices if v.get('Locale') == 'hi-IN' and v.get('Gender') == 'Female']
              if hindi_female:
                  return hindi_female[0]
              hindi = [v['ShortName'] for v in voices if v.get('Locale') == 'hi-IN']
              if hindi:
                  return hindi[0]
              raise RuntimeError('No hi-IN voice available')

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-48, seg.dBFS - 30), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0] - 80)
              b = min(len(seg), ranges[-1][1] + 130)
              return seg[a:b]

          def atempo_filter(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0)
                  factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5)
                  factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={p:.6f}' for p in parts)

          def fit_to_slot(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', str(src),
                  '-filter:a', atempo_filter(factor), '-ar', '48000', '-ac', '1', str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1_000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          def wrap_words(text: str, width: int = 44) -> str:
              words = text.split()
              lines = []
              line = ''
              for word in words:
                  test = word if not line else line + ' ' + word
                  if len(test) <= width:
                      line = test
                  else:
                      if line:
                          lines.append(line)
                      line = word
              if line:
                  lines.append(line)
              if len(lines) <= 2:
                  return '\n'.join(lines)
              mid = math.ceil(len(words) / 2)
              return ' '.join(words[:mid]) + '\n' + ' '.join(words[mid:])

          async def main() -> None:
              voice = await choose_voice()
              print('Using voice:', voice)
              timeline = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta = []
              srt_entries = []
              script_lines = []

              for i, (start, text) in enumerate(CUES, 1):
                  mp3 = TMP / f'cue_{i:02d}.mp3'
                  wav = CUE_DIR / f'cue_{i:02d}.wav'
                  communicate = edge_tts.Communicate(text=text, voice=voice, rate='-10%', pitch='-2Hz', volume='+0%')
                  await communicate.save(str(mp3))
                  seg = AudioSegment.from_file(mp3)
                  seg = trim(seg).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else 539.2
                  max_ms = max(500, int((next_start - start - 0.35) * 1000))
                  seg = fit_to_slot(seg, max_ms, i)
                  seg = seg.fade_in(22).fade_out(45)
                  seg.export(wav, format='wav')
                  timeline = timeline.overlay(seg, position=int(start * 1000))
                  end = min(next_start - 0.12, start + len(seg) / 1000)
                  meta.append({'index': i, 'start': start, 'end': end, 'duration': len(seg)/1000, 'text': text})
                  srt_entries.append(f'{i}\n{srt_time(start)} --> {srt_time(end)}\n{wrap_words(text)}\n')
                  script_lines.append(f'{start:06.1f}–{end:06.1f}  {text}')

              timeline = timeline[:TOTAL_MS]
              wav_out = OUT / 'Vishranti_Bindu_Step1A_Hindi_Narration.wav'
              m4a_out = OUT / 'Vishranti_Bindu_Step1A_Hindi_Narration.m4a'
              timeline.export(wav_out, format='wav')
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', str(wav_out),
                  '-c:a', 'aac', '-b:a', '192k', str(m4a_out)
              ], check=True)
              (OUT / 'Vishranti_Bindu_Step1A_Hindi_Subtitles.srt').write_text('\n'.join(srt_entries), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Step1A_Voiceover_Script.txt').write_text('\n'.join(script_lines), encoding='utf-8')
              (OUT / 'cues.json').write_text(json.dumps({'voice': voice, 'duration_seconds': 540, 'cues': meta}, ensure_ascii=False, indent=2), encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio package
        uses: actions/upload-artifact@v4
        with:
          name: vb-step1a-finding-audio
          path: vb_step1a_finding_audio
          retention-days: 1
