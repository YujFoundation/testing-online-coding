name: VB Video3 Setup Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB Video3 setup audio')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_video3_setup_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_video3_setup_run_id.txt
          git commit -m 'automation: publish VB Video3 setup run id' || true
          git push

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate timed Hindi narration
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          OUT = Path('vb_video3_setup_audio')
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_video3_audio')
          OUT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 500_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु बेसिक। वीडियो तीन। सही बैठने की स्थिति और प्रारम्भिक तैयारी।'),
              (11.0, 'यह सामग्री केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (21.0, 'आज हम केवल शरीर और हाथों की सही तैयारी सीखेंगे। अंगूठे और तर्जनी का स्पर्श अगले वीडियो में कराया जाएगा।'),
              (35.0, 'इस वीडियो के अंत तक आप एक स्थिर, सहज और बिना अनावश्यक तनाव वाली बैठने की स्थिति स्वयं बना सकेंगे।'),
              (48.0, 'दर्द, चक्कर या असामान्य बेचैनी हो, तो अभ्यास रोकें। आरामदायक स्थिति चुनें और आवश्यकता हो तो शिक्षक से बात करें।'),
              (62.0, 'बैठने के तीन सामान्य विकल्प देखें।'),
              (68.0, 'पहला विकल्प है सुखासन। पैर सहज रूप से क्रॉस हों और शरीर का आधार स्थिर रहे।'),
              (80.0, 'दूसरा विकल्प है वज्रासन। केवल तभी चुनें, जब घुटनों और टखनों में सहजता बनी रहे।'),
              (92.0, 'तीसरा विकल्प है स्थिर कुर्सी। दोनों पैर ज़मीन पर टिके हों और बैठने का आधार सुरक्षित हो।'),
              (105.0, 'मुद्रा का नाम सबसे महत्वपूर्ण नहीं है। महत्वपूर्ण है कि आप कुछ मिनट बिना दर्द, दबाव या बार बार हिले बैठ सकें।'),
              (119.0, 'अब अपनी सुविधानुसार एक विकल्प चुनिए।'),
              (126.0, 'आपके पास पंद्रह सेकंड हैं। अपनी जगह और बैठने का आधार तैयार कर लीजिए।'),
              (142.0, 'अब शरीर के आधार की जाँच करें।'),
              (149.0, 'सुखासन में दोनों पैरों और बैठने वाली हड्डियों का भार ज़मीन या आसन पर स्थिर रहने दें।'),
              (160.0, 'वज्रासन में नितम्ब एड़ियों की ओर सहज रहें। घुटनों या टखनों पर दबाव हो, तो इस विकल्प को न चुनें।'),
              (172.0, 'कुर्सी पर बैठें, तो दोनों तलवे ज़मीन पर रखें। घुटने सहज कोण में रहें और शरीर आगे या पीछे न लटके।'),
              (188.0, 'शरीर का भार दाएँ या बाएँ खिसका हुआ न हो। बीच में संतुलित बैठें।'),
              (198.0, 'अब रीढ़ को स्वाभाविक रूप से सीधा होने दें।'),
              (207.0, 'सीधा होने का अर्थ कठोर होना नहीं है। छाती फुलाकर या कमर को खींचकर बैठने की आवश्यकता नहीं है।'),
              (219.0, 'सिर को रीढ़ के ऊपर संतुलित रखें। ठोड़ी न बहुत ऊपर हो, न बहुत नीचे।'),
              (230.0, 'अब पंद्रह सेकंड लेकर अपना आधार, रीढ़, सिर और ठोड़ी ठीक कर लीजिए।'),
              (247.0, 'अब शरीर के अनावश्यक तनाव को एक एक करके छोड़ें।'),
              (254.0, 'कंधों को कानों से दूर, नीचे और सहज रहने दें।'),
              (264.0, 'जबड़े को ढीला रखें। दाँतों को कसकर न रखें और चेहरे पर तनाव न बनाएँ।'),
              (275.0, 'पेट को भीतर खींचने या कठोर रखने की आवश्यकता नहीं है। उसे सहज रहने दें।'),
              (286.0, 'हाथों और उँगलियों में अनावश्यक पकड़ छोड़ दें।'),
              (296.0, 'अब पंद्रह सेकंड कंधों, जबड़े, पेट और हाथों को ढीला करने के लिए लें।'),
              (313.0, 'अब हाथों की प्रारम्भिक स्थिति समझें।'),
              (321.0, 'दोनों हाथों को जाँघों या गोद पर आराम से रखें।'),
              (331.0, 'हथेलियाँ ऊपर की ओर रहें। कोहनियाँ, कलाई और उँगलियाँ ढीली रहें।'),
              (342.0, 'दीक्षा के समय जिस हाथ या दोनों हाथों का निर्देश मिला है, केवल उसी निर्देश का पालन करें।'),
              (355.0, 'यदि आपको दिया हुआ हाथ याद नहीं है, तो अपनी ओर से निर्णय न लें। अभ्यास से पहले शिक्षक से पूछें।'),
              (368.0, 'इस वीडियो में अभी अंगूठे और तर्जनी को मिलाना नहीं है। केवल सही हाथ की स्थिति तैयार करनी है।'),
              (379.0, 'अब अठारह सेकंड लेकर हाथों को जाँघों या गोद पर रखें, हथेलियाँ ऊपर करें और पूरे हाथ को ढीला छोड़ें।'),
              (399.0, 'अब आँखों और पूरे शरीर की अंतिम तैयारी करें।'),
              (407.0, 'आँखें केवल तब बंद करें, जब आप सुरक्षित रूप से बैठे हों और आसपास की स्थिति पूरी तरह सुरक्षित हो।'),
              (419.0, 'पलकों को धीरे से बंद करें। उन्हें कसें नहीं। शरीर को कुछ क्षण अपनी जगह स्थिर होने दें।'),
              (432.0, 'अब बारह सेकंड शांत बैठें और देखें कि कहीं अनावश्यक तनाव तो शेष नहीं है।'),
              (447.0, 'अंतिम जाँच करें।'),
              (455.0, 'क्या बैठने का आधार स्थिर और आरामदायक है? क्या रीढ़ स्वाभाविक है और सिर संतुलित है?'),
              (468.0, 'क्या कंधे, जबड़ा, पेट और हाथ ढीले हैं? क्या हथेलियाँ ऊपर हैं और दिया हुआ हाथ सही स्थिति में है?'),
              (483.0, 'यदि सब सहज है, तो आपकी प्रारम्भिक स्थिति तैयार है। अगले वीडियो में बहुत हल्का अंगूठा तर्जनी स्पर्श सीखा जाएगा।'),
          ]

          async def synth(text: str, out_mp3: Path) -> None:
              comm = edge_tts.Communicate(text, VOICE, rate='-5%', pitch='+0Hz', volume='+0%')
              await comm.save(str(out_mp3))

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-47, seg.dBFS-28), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0]-70)
              b = min(len(seg), ranges[-1][1]+120)
              return seg[a:b]

          def atempo_chain(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
                  '-filter:a',atempo_chain(factor),'-ar','48000','-ac','1',str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec*1000))
              h, ms = divmod(ms, 3600000); m, ms = divmod(ms, 60000); s, ms = divmod(ms, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          async def main() -> None:
              master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta = []
              srt = []
              script_lines = []
              for i, (start, text) in enumerate(CUES, 1):
                  mp3 = TMP / f'{i:02d}.mp3'
                  await synth(text, mp3)
                  seg = trim(AudioSegment.from_file(mp3)).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else TOTAL_MS/1000
                  max_ms = max(900, int((next_start-start)*1000)-280)
                  seg = fit(seg, max_ms, i)
                  wav = CUE_DIR / f'{i:02d}.wav'
                  seg.export(wav, format='wav')
                  master = master.overlay(seg, position=int(start*1000))
                  end = min(TOTAL_MS/1000, start + len(seg)/1000)
                  meta.append({'start':start,'end':end,'text':text,'audio':wav.name})
                  srt.extend([str(i), f'{srt_time(start)} --> {srt_time(end)}', text, ''])
                  script_lines.append(text)

              wav_master = OUT / 'Vishranti_Bindu_Video3_Hindi_Narration.wav'
              m4a_master = OUT / 'Vishranti_Bindu_Video3_Hindi_Narration.m4a'
              master.export(wav_master, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav_master),
                  '-af','highpass=f=70,lowpass=f=12000,alimiter=limit=0.94',
                  '-t',str(TOTAL_MS/1000),'-c:a','aac','-b:a','192k','-ar','48000','-ac','2',str(m4a_master)
              ], check=True)
              (OUT/'cues.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              (OUT/'Vishranti_Bindu_Video3_Hindi_Subtitles.srt').write_text('\n'.join(srt),encoding='utf-8')
              (OUT/'Vishranti_Bindu_Video3_Hindi_Voiceover_Script.txt').write_text('\n\n'.join(script_lines),encoding='utf-8')
              (OUT/'README.txt').write_text('Timed Hindi narration for VB Basic Video 3 — Correct Sitting Position and Initial Setup. Duration: 8:20. Voice: hi-IN-SwaraNeural.',encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-video3-setup-audio
          path: vb_video3_setup_audio
          retention-days: 1
