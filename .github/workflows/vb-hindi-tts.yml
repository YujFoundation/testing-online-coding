name: VB Hindi TTS Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vb-hindi-tts.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Piper and Hindi voice
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install --quiet pydub
          curl -L --retry 4 -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          chmod +x piper/piper
          mkdir -p model
          curl -L --retry 4 -o model/voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx
          curl -L --retry 4 -o model/voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json

      - name: Generate clear Hindi narration
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from pathlib import Path
          import json, subprocess
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          root = Path.cwd()
          out = root / 'vb_hindi_audio_bundle'
          cues_dir = out / 'voice_cues'
          tmp = root / 'tmp_audio'
          out.mkdir(exist_ok=True)
          cues_dir.mkdir(exist_ok=True)
          tmp.mkdir(exist_ok=True)

          piper = root / 'piper' / 'piper'
          model = root / 'model' / 'voice.onnx'
          config = root / 'model' / 'voice.onnx.json'
          total_ms = 300000

          cues = [
            (2.0, 'विश्रांति बिन्दु।'),
            (5.0, 'प्रारम्भिक स्पर्श-बिन्दु अभ्यास।'),
            (9.0, 'यह अभ्यास केवल दीक्षित साधकों और अधिकृत आंतरिक प्रशिक्षण के लिए है।'),
            (18.0, 'अभ्यास शुरू करने से पहले, किसी सुरक्षित और शांत स्थान पर बैठ जाएँ।'),
            (27.0, 'वाहन चलाते समय, सड़क पार करते समय, या मशीन चलाते समय यह अभ्यास न करें।'),
            (37.0, 'दर्द, चक्कर, घबराहट या असामान्य बेचैनी हो, तो तुरंत रुकें और अपने शिक्षक से संपर्क करें।'),
            (49.0, 'अब शरीर को सहज होने दें।'),
            (53.5, 'कंधों को ढीला छोड़ें।'),
            (57.0, 'जबड़े, पेट और हाथों में अनावश्यक तनाव न रखें।'),
            (63.5, 'हथेलियाँ ऊपर की ओर रखते हुए, हाथों को जाँघों या गोद पर टिकाएँ।'),
            (71.0, 'आँखें धीरे से बंद करें।'),
            (76.0, 'अब अंगूठे और तर्जनी की नोक को बहुत हल्के से मिलाएँ।'),
            (83.5, 'बस स्पर्श हो। दबाव बिल्कुल न दें।'),
            (89.0, 'ध्यान उस छोटे से बिन्दु पर ले आएँ, जहाँ दोनों उँगलियाँ मिल रही हैं।'),
            (97.0, 'सबसे पहले वास्तविक शारीरिक स्पर्श को जानें।'),
            (103.0, 'गर्माहट, हल्का दबाव और त्वचा की बनावट महसूस करें।'),
            (110.0, 'किसी विशेष अनुभव की प्रतीक्षा न करें।'),
            (115.5, 'जो इस समय सचमुच महसूस हो रहा है, केवल उसी के साथ रहें।'),
            (123.0, 'यदि केवल साधारण स्पर्श महसूस हो रहा है, तो वही सही शुरुआत है।'),
            (131.0, 'ध्यान भटके, तो बिना झुँझलाहट इसी स्पर्श-बिन्दु पर लौट आएँ।'),
            (142.0, 'यदि गर्माहट, झनझनाहट, धड़कन या कंपन महसूस हो, तो उसे केवल देखें।'),
            (150.0, 'खिंचाव, प्रवाह या कोई और सूक्ष्म अनुभव आए, तो उसे भी रहने दें।'),
            (158.0, 'उसे बढ़ाने, कल्पना करने या जबरन पैदा करने की कोशिश न करें।'),
            (166.0, 'अंगूठे और तर्जनी के मूल स्पर्श-बिन्दु को प्राथमिक रखें।'),
            (176.0, 'अब कुछ क्षण शांत रहें। केवल स्पर्श-बिन्दु को महसूस करें।'),
            (200.0, 'अनुभव हाथ, बाँह या शरीर में फैले, तो उसे रहने दें।'),
            (207.0, 'लेकिन मूल स्पर्श-बिन्दु को न छोड़ें।'),
            (217.0, 'अब अंगूठे और तर्जनी को केवल दो से तीन मिलीमीटर अलग करें।'),
            (225.0, 'अंतर बहुत छोटा रखें।'),
            (229.0, 'ध्यान दोनों उँगलियों के बीच बने छोटे से स्थान में रखें।'),
            (236.0, 'देखें, संपर्क हटने के बाद भी कोई गर्माहट, कंपन या खिंचाव महसूस होता है या नहीं।'),
            (246.5, 'जो भी है, केवल उसे जानें।'),
            (252.0, 'अंतर को और न बढ़ाएँ।'),
            (256.0, 'अब दोनों नोकों को फिर से बहुत हल्के स्पर्श में ले आएँ।'),
            (263.0, 'ध्यान मूल बिन्दु पर लौटाएँ।'),
            (271.0, 'अब हाथों को ढीला छोड़ें।'),
            (275.0, 'पूरे शरीर और आसपास के स्थान की उपस्थिति महसूस करें।'),
            (282.0, 'आँखें धीरे से खोलें।'),
            (286.0, 'कुछ सूक्ष्म महसूस न होना भी बिल्कुल मान्य है।'),
            (291.0, 'तारीख, समय और अनुभव डायरी में लिखें। आगे केवल शिक्षक की अनुमति से बढ़ें।'),
          ]

          def trim(seg):
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-46, seg.dBFS-28), seek_step=5)
              if not ranges:
                  return seg
              return seg[max(0, ranges[0][0]-90):min(len(seg), ranges[-1][1]+140)]

          def tempo_filter(factor):
              values=[]
              while factor > 2.0:
                  values.append(2.0); factor/=2.0
              while factor < 0.5:
                  values.append(0.5); factor/=0.5
              values.append(factor)
              return ','.join(f'atempo={v:.6f}' for v in values)

          narration = AudioSegment.silent(duration=total_ms, frame_rate=48000).set_channels(2)
          built=[]

          for i, (start, text) in enumerate(cues):
              raw = tmp / f'raw_{i:02d}.wav'
              cmd=[str(piper), '--model', str(model), '--config', str(config), '--output_file', str(raw), '--length_scale', '1.06', '--noise_scale', '0.55', '--noise_w', '0.65']
              subprocess.run(cmd, input=text+'\n', text=True, check=True)
              seg=trim(AudioSegment.from_wav(raw)).set_frame_rate(48000).set_channels(1)
              if seg.dBFS != float('-inf'):
                  seg=seg.apply_gain(-18.5-seg.dBFS)
              seg=seg.fade_in(35).fade_out(90)
              next_start = cues[i+1][0] if i+1 < len(cues) else 299.8
              max_ms=max(900, int((next_start-start-0.25)*1000))
              if len(seg) > max_ms:
                  src=tmp/f'fit_{i:02d}_src.wav'; dst=tmp/f'fit_{i:02d}_dst.wav'
                  seg.export(src, format='wav')
                  factor=len(seg)/max_ms
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),'-filter:a',tempo_filter(factor),'-ar','48000','-ac','1',str(dst)],check=True)
                  seg=AudioSegment.from_wav(dst)
              cue_path=cues_dir/f'cue_{i+1:02d}.wav'
              seg.export(cue_path, format='wav')
              start_ms=round(start*1000); end_ms=min(total_ms,start_ms+len(seg))
              narration=narration.overlay(seg.set_channels(2),position=start_ms)
              built.append({'index':i+1,'start':start_ms/1000,'end':end_ms/1000,'text':text,'duration':len(seg)/1000,'file':cue_path.name})

          narration.export(out/'Hindi_Narration_Clear_Female.wav',format='wav',parameters=['-acodec','pcm_s16le'])
          narration[:60000].export(out/'Hindi_Voice_60s_Preview.mp3',format='mp3',bitrate='192k')
          (out/'cues.json').write_text(json.dumps(built,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'Hindi_Voiceover_Revised.txt').write_text('\n\n'.join(f"[{x['start']:06.3f} - {x['end']:06.3f}] {x['text']}" for x in built),encoding='utf-8')
          print(json.dumps({'cues':len(built),'last_end':built[-1]['end'],'duration_ms':len(narration)},ensure_ascii=False))
          PY
          python build_audio.py
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 vb_hindi_audio_bundle/Hindi_Narration_Clear_Female.wav

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-hindi-audio-bundle
          path: vb_hindi_audio_bundle
          if-no-files-found: error
          retention-days: 1
