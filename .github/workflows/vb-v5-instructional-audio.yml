name: VB V5 Instructional Hindi Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB V5 instructional audio')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_v5_audio_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_v5_audio_run_id.txt
          git commit -m 'automation: publish VB V5 audio run id' || true
          git push

      - name: Install Piper and audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install --quiet pydub

          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o piper_linux_x86_64.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          chmod +x piper/piper

          mkdir -p model
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o model/hi_IN-priyamvada-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o model/hi_IN-priyamvada-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium.onnx.json

      - name: Build timed narration and subtitles
        shell: bash
        run: |
          cat > build_v5_audio.py <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          ROOT = Path.cwd()
          OUT = ROOT / 'vb_v5_audio_bundle'
          TMP = ROOT / 'vb_v5_tmp'
          CUE_DIR = OUT / 'voice_cues'
          OUT.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)

          PIPER = ROOT / 'piper' / 'piper'
          MODEL = ROOT / 'model' / 'hi_IN-priyamvada-medium.onnx'
          CONFIG = ROOT / 'model' / 'hi_IN-priyamvada-medium.onnx.json'
          TOTAL_MS = 300_000
          TARGET_DBFS = -18.0

          # Instructional-design sequence: explain -> demonstrate -> learner practice.
          CUES = [
              (2.0, 6.6, 'विश्रांति बिन्दु। प्रारम्भिक स्पर्श-बिन्दु अभ्यास।'),
              (7.0, 18.8, 'इस वीडियो में हर चरण पहले समझाया जाएगा, फिर दिखाया जाएगा, और उसके बाद आपको स्वयं करने का समय मिलेगा।'),

              (20.5, 24.4, 'अभ्यास केवल सुरक्षित और शांत स्थान पर करें।'),
              (25.0, 29.8, 'इस सत्र में आँखें केवल बैठी हुई स्थिर स्थिति में बंद करें।'),
              (30.5, 35.4, 'चलते या खड़े अभ्यास में आँखें खुली रखें। वाहन, सड़क या मशीन के समय यह अभ्यास न करें।'),
              (36.0, 41.4, 'दर्द, चक्कर, घबराहट या असामान्य बेचैनी हो, तो तुरंत रुकें और शिक्षक से संपर्क करें।'),

              (43.0, 45.8, 'अब बैठने की स्थिति चुनें।'),
              (46.0, 51.7, 'सुखासन, वज्रासन, या कुर्सी। जो आपके शरीर के लिए स्थिर और सहज हो।'),
              (52.0, 57.8, 'रीढ़ को जबरन सीधा न खींचें। शरीर स्थिर हो, पर कठोर नहीं।'),
              (58.0, 63.5, 'हथेलियाँ जाँघों या गोद पर ऊपर की ओर रखें।'),
              (64.0, 68.4, 'अब अपनी सुविधाजनक स्थिति में बैठ जाएँ।'),
              (68.7, 71.5, 'आपके पास कुछ सेकंड हैं।'),

              (79.0, 82.2, 'अब शरीर को एक-एक भाग में ढीला करें।'),
              (82.8, 84.2, 'कंधे।'),
              (85.0, 86.4, 'जबड़ा।'),
              (87.2, 88.6, 'पेट।'),
              (89.4, 90.8, 'और हाथ।'),
              (91.5, 97.2, 'अनावश्यक तनाव छोड़ें, फिर आँखें धीरे से बंद करें।'),
              (98.0, 101.6, 'अब कुछ सेकंड केवल स्थिर रहें।'),

              (111.0, 113.8, 'अब हाथ की स्थिति समझें।'),
              (114.0, 119.7, 'अंगूठे और तर्जनी की नोक को बहुत हल्के से मिलाएँ।'),
              (120.0, 125.4, 'उद्देश्य केवल त्वचा का स्पर्श है। दबाव नहीं।'),
              (126.0, 132.8, 'जिस छोटी जगह पर दोनों नोकें मिलती हैं, वही आपका मूल स्पर्श-बिन्दु है।'),
              (133.0, 137.6, 'अब अपने हाथ में यही हल्का स्पर्श बनाएँ।'),
              (138.0, 141.2, 'अभी स्वयं करके देखें।'),

              (153.0, 156.0, 'अब समझें कि सबसे पहले क्या जानना है।'),
              (156.5, 158.6, 'पहला। सीधा स्पर्श।'),
              (159.5, 161.8, 'दूसरा। हल्का दबाव।'),
              (162.5, 164.5, 'तीसरा। गर्माहट।'),
              (165.2, 167.8, 'चौथा। त्वचा की बनावट।'),
              (168.5, 175.6, 'पहले इन्हीं वास्तविक शारीरिक संकेतों को जानें। किसी विशेष अनुभव की प्रतीक्षा न करें।'),
              (176.0, 180.8, 'अब कुछ समय केवल स्पर्श-बिन्दु को महसूस करें।'),

              (195.0, 200.0, 'इसके बाद कोई सूक्ष्म अनुभव अपने आप आए, तो उसे केवल देखें।'),
              (200.5, 207.0, 'झनझनाहट, धड़कन, कंपन, खिंचाव या प्रवाह। इनमें से कुछ भी हो सकता है, या कुछ भी नहीं।'),
              (207.5, 212.0, 'न कल्पना करें, न बढ़ाएँ, न जबरन पैदा करें।'),
              (212.2, 216.6, 'मूल स्पर्श-बिन्दु को प्राथमिक रखें।'),
              (217.0, 221.8, 'अब शांत अवलोकन करें। ध्यान भटके, तो इसी बिन्दु पर लौट आएँ।'),

              (236.0, 239.0, 'अब दो से तीन मिलीमीटर का अंतर समझें।'),
              (239.5, 246.5, 'उँगलियों को केवल इतना अलग करें कि स्पर्श छूट जाए। अंतर पेंसिल की मोटाई जितना छोटा रहे।'),
              (247.0, 253.2, 'ध्यान दोनों नोकों के बीच बने छोटे स्थान में रखें। अंतर को और न बढ़ाएँ।'),
              (254.0, 258.5, 'अब इस छोटे अंतर को स्वयं महसूस करें।'),

              (273.0, 277.4, 'अब दोनों नोकों को फिर बहुत हल्के स्पर्श में ले आएँ।'),
              (277.8, 280.2, 'ध्यान मूल बिन्दु पर लौटाएँ।'),
              (280.5, 283.0, 'कुछ सेकंड यहीं रहें।'),

              (291.0, 295.2, 'अब हाथ ढीले छोड़ें, शरीर को महसूस करें और आँखें धीरे खोलें।'),
              (295.5, 299.6, 'अनुभव डायरी में लिखें। कुछ सूक्ष्म महसूस न होना भी मान्य है। आगे केवल शिक्षक की अनुमति से बढ़ें।'),
          ]

          def run_piper(text: str, out_path: Path) -> None:
              cmd = [
                  str(PIPER), '--model', str(MODEL), '--config', str(CONFIG),
                  '--output_file', str(out_path), '--length_scale', '1.03',
                  '--noise_scale', '0.50', '--noise_w', '0.62',
              ]
              subprocess.run(cmd, input=text + '\n', text=True, check=True)

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              spans = detect_nonsilent(seg, min_silence_len=65, silence_thresh=max(-46, seg.dBFS - 28), seek_step=5)
              if not spans:
                  return seg
              start = max(0, spans[0][0] - 70)
              end = min(len(seg), spans[-1][1] + 110)
              return seg[start:end]

          def atempo_filter(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', str(src),
                  '-filter:a', atempo_filter(factor), '-ar', '48000', '-ac', '1', str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def fmt_srt(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1_000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1).set_sample_width(2)
          manifest = []
          srt = []
          voice_text = []

          for idx, (start, hard_end, text) in enumerate(CUES, start=1):
              raw = TMP / f'raw_{idx:02d}.wav'
              run_piper(text, raw)
              seg = trim(AudioSegment.from_wav(raw)).set_frame_rate(48000).set_channels(1).set_sample_width(2)
              max_ms = max(500, int((hard_end - start) * 1000))
              seg = fit(seg, max_ms, idx)
              if seg.dBFS != float('-inf'):
                  seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
              seg = seg.fade_in(18).fade_out(40)
              cue_path = CUE_DIR / f'cue_{idx:02d}.wav'
              seg.export(cue_path, format='wav')
              master = master.overlay(seg, position=int(start * 1000))
              end = min(hard_end, start + len(seg) / 1000.0)
              manifest.append({'index': idx, 'start': start, 'end': end, 'hard_end': hard_end, 'text': text, 'duration': len(seg)/1000})
              srt.extend([str(idx), f'{fmt_srt(start)} --> {fmt_srt(end)}', text, ''])
              voice_text.append(f'{start:06.1f}–{end:06.1f}  {text}')

          master = master.fade_in(250).fade_out(500)
          master.export(OUT / 'Vishranti_Bindu_V5_Hindi_Narration.wav', format='wav')
          subprocess.run([
              'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
              '-i', str(OUT / 'Vishranti_Bindu_V5_Hindi_Narration.wav'),
              '-c:a', 'aac', '-b:a', '192k', str(OUT / 'Vishranti_Bindu_V5_Hindi_Narration.m4a')
          ], check=True)
          (OUT / 'Vishranti_Bindu_V5_Hindi_Subtitles.srt').write_text('\n'.join(srt), encoding='utf-8')
          (OUT / 'Vishranti_Bindu_V5_Voiceover_Script.txt').write_text('\n'.join(voice_text), encoding='utf-8')
          (OUT / 'cues.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Built', len(manifest), 'cues')
          PY

          python build_v5_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-v5-instructional-audio
          path: vb_v5_audio_bundle
          retention-days: 1
