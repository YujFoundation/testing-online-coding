name: VB V5 Clean Hand Asset

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-hand:
    if: startsWith(github.event.issue.title, '[automation] Fetch VB V5 clean hand asset')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_v5_hand_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_v5_hand_run_id.txt
          git commit -m 'automation: publish VB V5 hand run id' || true
          git push
      - name: Download clean hand photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vb_v5_hand_asset
          curl -A 'Mozilla/5.0' -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            'https://images.pexels.com/photos/9017432/pexels-photo-9017432.jpeg?cs=srgb&dl=pexels-kevin-malik-9017432.jpg&fm=jpg' \
            -o vb_v5_hand_asset/clean_thumb_index_hand.jpg
          test -s vb_v5_hand_asset/clean_thumb_index_hand.jpg
          file vb_v5_hand_asset/clean_thumb_index_hand.jpg | grep -q 'JPEG image data'
          cat > vb_v5_hand_asset/SOURCE.txt <<'TXT'
          Pexels photo 9017432 by Kevin Malik — clean thumb-index hand photograph.
          TXT
      - name: Upload hand asset
        uses: actions/upload-artifact@v4
        with:
          name: vb-v5-clean-hand-asset
          path: vb_v5_hand_asset
          retention-days: 1
