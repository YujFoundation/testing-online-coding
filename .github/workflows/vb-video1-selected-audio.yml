name: VB Selected Video1 Hindi Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB selected Video1 audio')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_selected_video1_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_selected_video1_run_id.txt
          git commit -m 'automation: publish selected VB Video1 run id' || true
          git push

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate narration, cues and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          OUT = Path('vb_selected_video1_audio')
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_selected_video1_audio')
          OUT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 460_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु। वीडियो एक। कार्यक्रम सीमा, सुरक्षा और अनिवार्य आधार।'),
              (11.0, 'यह वीडियो केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (23.0, 'आज हम किसी अभ्यास को करने नहीं जा रहे हैं। पहले यह समझेंगे कि यह मार्ग किस सीमा में चलना है, कहाँ सुरक्षित है, और किन नियमों का पालन अनिवार्य है।'),
              (39.0, 'यह सामग्री केवल स्रोत आधारित क्रियान्वयन पर केन्द्रित है। इसमें दार्शनिक सिद्धान्त, अनुभव कथाएँ या किसी विशेष परिणाम की गारंटी शामिल नहीं है।'),
              (55.0, 'जो क्रम शिक्षक द्वारा दिया गया है, उसी क्रम का पालन करना है। अपनी ओर से कोई नया चरण, नया प्रयोग या मिश्रित विधि नहीं जोड़नी है।'),

              (72.0, 'सबसे पहले सुरक्षा सीमा समझें। आँखें बंद करके अभ्यास केवल तब करें, जब आप सुरक्षित रूप से बैठे हों या सुरक्षित रूप से लेटे हों।'),
              (88.0, 'चलते समय या किसी शारीरिक गति का अभ्यास करते समय आँखें खुली रखें और आसपास की परिस्थिति की पूरी जानकारी बनाए रखें।'),
              (105.0, 'वाहन चलाते समय, मशीन चलाते समय, सड़क पार करते समय, या किसी ऐसे काम में यह अभ्यास न करें जिसमें पूरा बाहरी ध्यान आवश्यक हो।'),
              (126.0, 'इन परिस्थितियों में भीतर की ओर ध्यान ले जाना आपके लिए या किसी दूसरे व्यक्ति के लिए जोखिम पैदा कर सकता है।'),

              (141.0, 'अब उन संकेतों को जानें जिन पर तुरंत रुकना है।'),
              (149.0, 'दर्द, चक्कर, साँस फूलना, घबराहट, बेहोशी या ब्लैकआउट, गंभीर दिशाभ्रम, या सामान्य काम करने में कठिनाई हो, तो अभ्यास तुरंत रोकें।'),
              (171.0, 'आँखें खोलें, सामान्य गतिविधि में लौटें, शरीर को स्थिर करें और शिक्षक से संपर्क करें। आवश्यकता हो तो उचित स्वास्थ्य सहायता लें।'),
              (191.0, 'रुकना असफलता नहीं है। सुरक्षा, अभ्यास से पहले आती है।'),

              (204.0, 'अब इस मार्ग की प्रगति को संक्षेप में समझें।'),
              (212.0, 'दीक्षा में मूल thumb–index awareness anchor और दिया हुआ hand position सीखा जाता है। आगे तभी बढ़ना है, जब विद्यार्थी इस setup को सुरक्षित रूप से दोहरा सके।'),
              (232.0, 'Step 1 में finger touch या presence को स्थिर किया जाता है और उसे दैनिक जीवन में लाया जाता है। स्रोत में लगभग तीन महीने का औसत समय बताया गया है, पर यह व्यक्ति अनुसार बदल सकता है।'),
              (257.0, 'Step 1 की प्रगति का संकेत है कि learner लगभग दो से पाँच सेकंड में अनुभव में प्रवेश कर सके और सामान्य परिस्थितियों में उसे बनाए रख सके। यह लक्ष्य है, गारंटी नहीं।'),
              (278.0, 'Step 2 में नई core technique नहीं जुड़ती। Step 1 जारी रखते हुए sensitivity, stability और lifestyle correlations का मूल्यांकन किया जाता है।'),
              (298.0, 'Step 3 केवल teacher approval के बाद शुरू होता है। इसमें finger anchor के साथ body movement को एक साथ जाना जाता है। इसे स्थिर करने में लगभग एक से डेढ़ महीना लग सकता है।'),
              (322.0, 'नाभि क्षेत्र की अतिरिक्त advanced observation अलग और teacher controlled है। इसे लिखित निर्देश देखकर स्वयं शुरू नहीं करना है।'),

              (340.0, 'अब तीन non-negotiable नियम याद रखें।'),
              (348.0, 'पहला नियम। दिए गए क्रम का पालन करें। कोई stage skip, combine, intensify या invent न करें।'),
              (365.0, 'दूसरा नियम। Thumb और index finger का मूल point primary anchor रहेगा। शरीर, मन, भावना या अन्य sensation आए, तो उन्हें secondary observation की तरह रहने दें।'),
              (390.0, 'तीसरा नियम। किसी special experience को chase, manufacture, visualise या force न करें। जो वास्तव में उपस्थित है, केवल उसे जानें।'),
              (413.0, 'यदि केवल सामान्य physical touch उपलब्ध है, तो वही सही शुरुआती आधार है। उसे कमतर न मानें और किसी dramatic अनुभव की प्रतीक्षा न करें।'),

              (433.0, 'आज की पूरी बात तीन प्रश्नों में याद रखें। क्या स्थिति सुरक्षित है? क्या मैं assigned sequence में हूँ? क्या मैं केवल वास्तविक अनुभव को जान रहा हूँ, बिना force किए?'),
              (450.0, 'इन तीनों का उत्तर हाँ हो, तभी आगे बढ़ें। अगले वीडियो में कार्यक्रम के शेष अनिवार्य नियम, गोपनीयता और शिक्षक नियंत्रण समझेंगे।'),
          ]

          async def synth(text: str, out_mp3: Path) -> None:
              comm = edge_tts.Communicate(text, VOICE, rate='-5%', pitch='+0Hz', volume='+0%')
              await comm.save(str(out_mp3))

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-47, seg.dBFS - 28), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0] - 80)
              b = min(len(seg), ranges[-1][1] + 130)
              return seg[a:b]

          def atempo_chain(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
                  '-filter:a',atempo_chain(factor),'-ar','48000','-ac','1',str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1_000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          async def main() -> None:
              master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta, srt, script_lines = [], [], []
              for i, (start, text) in enumerate(CUES, 1):
                  mp3 = TMP / f'{i:02d}.mp3'
                  await synth(text, mp3)
                  seg = trim(AudioSegment.from_file(mp3)).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else TOTAL_MS / 1000
                  max_ms = max(1000, int((next_start - start) * 1000) - 300)
                  seg = fit(seg, max_ms, i)
                  wav = CUE_DIR / f'{i:02d}.wav'
                  seg.export(wav, format='wav')
                  master = master.overlay(seg, position=int(start * 1000))
                  end = min(TOTAL_MS / 1000, start + len(seg) / 1000)
                  meta.append({'start': start, 'end': end, 'text': text, 'audio': wav.name})
                  srt.extend([str(i), f'{srt_time(start)} --> {srt_time(end)}', text, ''])
                  script_lines.append(text)

              wav_master = OUT / 'Vishranti_Bindu_Selected_Video1_Hindi_Narration.wav'
              m4a_master = OUT / 'Vishranti_Bindu_Selected_Video1_Hindi_Narration.m4a'
              master.export(wav_master, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav_master),
                  '-af','highpass=f=70,lowpass=f=12000,alimiter=limit=0.94',
                  '-t',str(TOTAL_MS / 1000),'-c:a','aac','-b:a','192k','-ar','48000','-ac','2',str(m4a_master)
              ], check=True)
              (OUT / 'cues.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Selected_Video1_Hindi_Subtitles.srt').write_text('\n'.join(srt), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Selected_Video1_Hindi_Voiceover_Script.txt').write_text('\n\n'.join(script_lines), encoding='utf-8')
              (OUT / 'README.txt').write_text('Hindi narration bundle for selected Vishranti Bindu Video 1. Duration 07:40. Voice hi-IN-SwaraNeural.', encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-selected-video1-audio
          path: vb_selected_video1_audio
          retention-days: 1
