name: VB Video3 Daily-Life Hindi Audio

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-audio:
    if: startsWith(github.event.issue.title, '[automation] Build VB Video3 daily audio')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          echo '${{ github.run_id }}' > .automation/vb_video3_daily_run_id.txt
          git config user.name 'YUJ Automation'
          git config user.email 'automation@yujfoundation.invalid'
          git add .automation/vb_video3_daily_run_id.txt
          git commit -m 'automation: publish VB Video3 daily run id' || true
          git push

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub

      - name: Generate Hindi narration and subtitles
        shell: bash
        run: |
          cat > build_audio.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import re
          import subprocess
          from pathlib import Path

          import edge_tts
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent

          OUT = Path('vb_video3_daily_audio')
          CUE_DIR = OUT / 'voice_cues'
          TMP = Path('tmp_vb_video3_daily_audio')
          OUT.mkdir(exist_ok=True)
          CUE_DIR.mkdir(exist_ok=True)
          TMP.mkdir(exist_ok=True)

          TOTAL_MS = 690_000
          TARGET_DBFS = -18.0
          VOICE = 'hi-IN-SwaraNeural'

          CUES = [
              (2.0, 'विश्रांति बिन्दु। पाठ तीन। दैनिक जीवन में अभ्यास और नियमित लय।'),
              (9.0, 'यह सामग्री केवल दीक्षित साधकों, अधिकृत शिक्षकों और आंतरिक कार्यक्रम उपयोग के लिए है।'),
              (18.0, 'पिछले पाठों में आपने हल्का स्पर्श, छोटा अन्तर और मूल स्पर्श-बिन्दु पर लौटना सीखा। आज इन्हें सामान्य जीवन की सरल स्थितियों में बनाए रखना सीखेंगे।'),

              (34.0, 'चरण एक में कोई कठोर दैनिक न्यूनतम समय नहीं है। अभ्यास को जीवन पर बोझ नहीं बनाना है।'),
              (47.0, 'किसी दिन अभ्यास छूट जाए, तो उसे असफलता न मानें। अगला सुरक्षित अवसर मिले, वहीं से फिर आरम्भ करें।'),
              (62.0, 'लक्ष्य है उपलब्ध समय का उपयोग करना और धीरे-धीरे एक सहज अभ्यास-लय बनाना।'),

              (76.0, 'आज के अभ्यास के लिए एक सुरक्षित और सरल परिस्थिति चुनें।'),
              (84.0, 'उदाहरण के लिए, शांत बैठना, कुछ पंक्तियाँ पढ़ना, या यात्री के रूप में यात्रा करना।'),
              (98.0, 'चलते समय आँखें खुली रखें और आसपास की पूरी जानकारी बनाए रखें।'),
              (109.0, 'वाहन चलाते समय, सड़क पार करते समय, मशीन चलाते समय, या पूरे बाहरी ध्यान वाले काम में यह अभ्यास न करें।'),

              (126.0, 'मूल स्पर्श-बिन्दु समझ आने के बाद भुजा की कोई एक निश्चित स्थिति आवश्यक नहीं है।'),
              (138.0, 'हाथ को वहीं रखें जहाँ वह ढीला और सहज रह सके।'),
              (146.0, 'यदि एक हाथ थक जाए, तो केवल शिक्षक की अनुमति के अनुसार दूसरे हाथ का उपयोग करें।'),

              (160.0, 'अब देखें कि अभ्यास को किन सामान्य स्थितियों में जोड़ा जा सकता है।'),
              (168.0, 'बैठते हुए और पढ़ते हुए, गतिविधि सामान्य रखें और साथ ही मूल स्पर्श-बिन्दु को जानें।'),
              (182.0, 'खाते हुए, बातचीत करते हुए या पढ़ाते हुए भी यही सिद्धान्त है। काम चलता रहे, और बिन्दु की हल्की जानकारी साथ रहे।'),
              (199.0, 'यात्री के रूप में यात्रा करते समय अभ्यास किया जा सकता है, पर वाहन चलाते समय नहीं।'),
              (211.0, 'चलते समय आँखें खुली रहें। विश्राम करते समय, सोने से पहले और जागने के बाद भी सुरक्षित स्थिति में अभ्यास जोड़ा जा सकता है।'),
              (229.0, 'किसी गतिविधि को रोकना, धीमा करना या अस्वाभाविक बनाना उद्देश्य नहीं है। सामान्य जीवन के साथ जागरूकता को जोड़ना है।'),

              (246.0, 'कभी ध्यान हृदय, पेट, किसी स्मृति, भावना या दूसरी शारीरिक अनुभूति की ओर जा सकता है।'),
              (259.0, 'उसे हटाने, दबाने या बदलने की कोशिश न करें। उसे साथ रहने दें, पर मूल स्पर्श-बिन्दु मुख्य बना रहे।'),
              (276.0, 'यदि फैली हुई अनुभूतियाँ खो जाएँ, तो सीधे अंगूठे और तर्जनी के मूल स्पर्श-बिन्दु पर लौटें और उसे फिर स्पष्ट करें।'),

              (293.0, 'अब एक सरल उदाहरण देखकर समझें। हम पढ़ने की सामान्य गतिविधि के साथ अभ्यास जोड़ेंगे।'),
              (304.0, 'पहले हाथ ढीला रखें और अंगूठे तथा तर्जनी का अत्यन्त हल्का स्पर्श बनाएँ।'),
              (316.0, 'अब सामने लिखी पंक्ति को सामान्य गति से पढ़ें। पढ़ते समय स्पर्श-बिन्दु की हल्की जानकारी भी बनी रहने दें।'),
              (333.0, 'यदि पढ़ते-पढ़ते बिन्दु की जानकारी खो जाए, तो पढ़ना रोककर घबराएँ नहीं। एक क्षण मूल बिन्दु पर लौटें और फिर पढ़ना जारी रखें।'),

              (351.0, 'अब आप मेरे साथ यह अभ्यास करें।'),
              (357.0, 'सहज बैठें। आँखें खुली रखें, क्योंकि आप पढ़ने वाले हैं।'),
              (367.0, 'हाथ को आराम से रखें और अत्यन्त हल्का स्पर्श बनाएँ।'),
              (379.0, 'पहली पंक्ति पढ़िए। आज मैं एक सरल गतिविधि के साथ जागरूक रहना सीख रहा हूँ।'),
              (394.0, 'पढ़ना जारी रखते हुए स्पर्श-बिन्दु को हल्के से जानें।'),
              (406.0, 'दूसरी पंक्ति पढ़िए। मेरा काम सामान्य रहेगा और ध्यान हटे तो मैं वापस लौटूँगा।'),
              (423.0, 'अब जाँचें। क्या हाथ ढीला है? क्या स्पर्श बहुत हल्का है?'),
              (436.0, 'तीसरी पंक्ति पढ़िए। जो दूसरी अनुभूति आए, उसे रहने दूँगा और मूल बिन्दु को फिर जान लूँगा।'),
              (454.0, 'अब कुछ क्षण इसी तरह पढ़ते रहें। गतिविधि सामान्य रखें और मूल बिन्दु को साथ जानें।'),

              (482.0, 'अब एक मिनट का स्व-अभ्यास करें। स्क्रीन पर आने वाली पंक्तियाँ अपनी गति से पढ़ें और मूल स्पर्श-बिन्दु को साथ बनाए रखें।'),
              (498.0, 'ध्यान हटे, तो बस लौटें। स्वयं को दोष न दें और पढ़ना सामान्य रखें।'),
              (518.0, 'हाथ को ढीला रखें। स्पर्श को दबाएँ नहीं।'),
              (538.0, 'अन्तिम कुछ क्षण। पढ़ना और बिन्दु, दोनों को सहज रूप से जानें।'),

              (552.0, 'अब स्व-जाँच करें।'),
              (558.0, 'क्या पढ़ना स्वाभाविक रहा, या अभ्यास के कारण गतिविधि बदल गई?'),
              (570.0, 'क्या हाथ ढीला और स्पर्श हल्का रहा?'),
              (579.0, 'क्या ध्यान टूटने पर आप मूल स्पर्श-बिन्दु पर लौट सके?'),
              (591.0, 'यदि तीनों बातें पूरी तरह स्पष्ट नहीं हुईं, तो कोई समस्या नहीं। अगली बार सरल गतिविधि और छोटा समय चुनें।'),

              (606.0, 'अब अपनी अभ्यास-लय समझें।'),
              (613.0, 'लगभग पाँच मिनट का छोटा प्रयास दिन में उपलब्ध किसी सुरक्षित समय पर किया जा सकता है।'),
              (626.0, 'जब अभ्यास सहज हो, तो बीस से पैंतालीस मिनट के लम्बे प्रयास किए जा सकते हैं। अवधि धीरे-धीरे बढ़ाएँ।'),
              (643.0, 'प्रारम्भिक उपयुक्तता अवधि औसतन लगभग तीन महीने बताई गई है, पर यह व्यक्ति के अनुसार कम या अधिक हो सकती है।'),
              (660.0, 'स्रोत में एक से चार घंटे के वैकल्पिक विस्तृत अभ्यास का भी उल्लेख है। यह सामान्य दैनिक लक्ष्य नहीं है और शरीर पर जोर देकर नहीं करना है।'),

              (676.0, 'दर्द, तीव्र सुन्नता या परेशानी होने पर लम्बा अभ्यास रोकें। आज के लिए एक छोटा अभ्यास-समय और एक वैकल्पिक लम्बा समय लिख लें।'),
              (686.0, 'अवसर मिले तो अभ्यास करें, छूटे तो फिर आरम्भ करें, और ध्यान हटे तो मूल स्पर्श-बिन्दु पर लौटें।'),
          ]

          for _, text in CUES:
              if re.search(r'[A-Za-z]', text):
                  raise RuntimeError(f'अंग्रेज़ी अक्षर मिला: {text}')
              if '□' in text or '\ufffd' in text:
                  raise RuntimeError(f'अमान्य अक्षर मिला: {text}')

          async def synth(text: str, out_mp3: Path) -> None:
              communicate = edge_tts.Communicate(text, VOICE, rate='-2%', pitch='+0Hz', volume='+0%')
              await communicate.save(str(out_mp3))

          def trim(seg: AudioSegment) -> AudioSegment:
              if seg.dBFS == float('-inf'):
                  return seg
              ranges = detect_nonsilent(seg, min_silence_len=70, silence_thresh=max(-47, seg.dBFS - 28), seek_step=5)
              if not ranges:
                  return seg
              a = max(0, ranges[0][0] - 70)
              b = min(len(seg), ranges[-1][1] + 110)
              return seg[a:b]

          def atempo_chain(factor: float) -> str:
              parts = []
              while factor > 2.0:
                  parts.append(2.0); factor /= 2.0
              while factor < 0.5:
                  parts.append(0.5); factor /= 0.5
              parts.append(factor)
              return ','.join(f'atempo={x:.6f}' for x in parts)

          def fit(seg: AudioSegment, max_ms: int, idx: int) -> AudioSegment:
              if len(seg) <= max_ms:
                  return seg
              factor = len(seg) / max_ms
              src = TMP / f'fit_{idx:02d}_src.wav'
              dst = TMP / f'fit_{idx:02d}_dst.wav'
              seg.export(src, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
                  '-filter:a',atempo_chain(factor),'-ar','48000','-ac','1',str(dst)
              ], check=True)
              return AudioSegment.from_wav(dst)

          def srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1_000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          async def main() -> None:
              master = AudioSegment.silent(duration=TOTAL_MS, frame_rate=48000).set_channels(1)
              meta = []
              srt = []
              script_lines = []
              for i, (start, text) in enumerate(CUES, 1):
                  mp3 = TMP / f'{i:02d}.mp3'
                  await synth(text, mp3)
                  seg = trim(AudioSegment.from_file(mp3)).set_frame_rate(48000).set_channels(1)
                  if seg.dBFS != float('-inf'):
                      seg = seg.apply_gain(TARGET_DBFS - seg.dBFS)
                  next_start = CUES[i][0] if i < len(CUES) else TOTAL_MS / 1000
                  max_ms = max(900, int((next_start - start) * 1000) - 260)
                  seg = fit(seg, max_ms, i)
                  wav = CUE_DIR / f'cue_{i:03d}.wav'
                  seg.export(wav, format='wav')
                  master = master.overlay(seg, position=int(start * 1000))
                  end = min(TOTAL_MS / 1000, start + len(seg) / 1000)
                  meta.append({'start': start, 'end': end, 'text': text, 'audio': wav.name})
                  srt.extend([str(i), f'{srt_time(start)} --> {srt_time(end)}', text, ''])
                  script_lines.append(text)

              wav_master = OUT / 'Vishranti_Bindu_Video3_Hindi_Narration.wav'
              m4a_master = OUT / 'Vishranti_Bindu_Video3_Hindi_Narration.m4a'
              master.export(wav_master, format='wav')
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav_master),
                  '-af','highpass=f=70,lowpass=f=12000,loudnorm=I=-16.5:TP=-2.0:LRA=7,alimiter=limit=0.92',
                  '-t',str(TOTAL_MS / 1000),'-c:a','aac','-b:a','256k','-ar','48000','-ac','2',str(m4a_master)
              ], check=True)
              (OUT / 'cues.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Video3_Hindi_Subtitles.srt').write_text('\n'.join(srt), encoding='utf-8')
              (OUT / 'Vishranti_Bindu_Video3_Hindi_Voiceover_Script.txt').write_text('\n\n'.join(script_lines), encoding='utf-8')
              (OUT / 'README.txt').write_text('विश्रांति बिन्दु पाठ ३ के लिए समयबद्ध हिन्दी कथन और उपशीर्षक। कुल अवधि ११ मिनट ३० सेकंड।', encoding='utf-8')

          asyncio.run(main())
          PY
          python build_audio.py

      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: vb-video3-daily-audio
          path: vb_video3_daily_audio
          retention-days: 1
